const ITER = 150000;
const ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", STORE = "photo-tool-key";
const $ = id => document.getElementById(id);
const norm = s => [...(s || "").toUpperCase()].filter(c => ALPHA.includes(c)).join("");
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = new TextEncoder();

async function kid(code) {
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode("photo-tool:" + code)));
  return [...h.slice(0, 8)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function unlock(raw) {
  const code = norm(raw);
  if (code.length !== 12) return null;
  const w = KEYS[await kid(code)];
  if (!w) return null;
  const base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name:"PBKDF2", hash:"SHA-256", salt:unb64(w.s), iterations:ITER },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const m = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(w.i) }, k, unb64(w.c));
  const mk = await crypto.subtle.importKey("raw", m, "AES-GCM", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(PAYLOAD.i) }, mk, unb64(PAYLOAD.c)));
}
function show(html, code) {
  try { localStorage.setItem(STORE, code); } catch (e) {}
  const u = new URL(location.href);
  if (u.searchParams.has("k")) { u.searchParams.delete("k"); history.replaceState(null, "", u.pathname + u.search + u.hash); }
  document.open(); document.write(html); document.close();
}
async function tryCode(code, quiet) {
  try { const html = await unlock(code); if (html) { show(html, norm(code)); return true; } } catch (e) {}
  if (!quiet) $("err").textContent = "卡密无效或已停用，请核对后重试";
  return false;
}
function gate(msg) { $("wait").hidden = true; $("gate").hidden = false; $("err").textContent = msg || ""; }

(async () => {

  if (fromUrl && await tryCode(fromUrl, true)) return;

  if (saved) try { localStorage.removeItem(STORE); } catch (e) {}
  gate(fromUrl ? "这个链接里的卡密无效或已停用" : saved ? "之前的卡密已停用，请输入新卡密" : "");

})();
